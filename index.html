async function send(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),m=$('#m');m.textContent='';

if(!d.setuju)return m.textContent='Centang persetujuan privasi terlebih dahulu.';

if(!sb)return m.textContent='Layanan penyimpanan belum diaktifkan oleh pengelola situs, sehingga laporan belum dapat dikirim. Silakan hubungi pengacara lewat WhatsApp.';
const b=$('#go');b.disabled=true;b.textContent='Mengirim…';

<label>Nomor WhatsApp (opsional)<input name="wa" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx"></label>

<input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">

<label class="ck"><input type="checkbox" name="setuju"> <span>Saya mengerti dan menyetujui pemberitahuan privasi di atas.</span></label>
<p id="m" class="err" role="alert"></p><button class="btn d" id="go">Kirim Laporan</button></form>`;
$('#f').onsubmit=send}
async function send(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),m=$('#m');m.textContent='';
if(d.cerita.trim().length<20)return m.textContent='Cerita wajib diisi, minimal 20 karakter.';
if(!d.setuju)return m.textContent='Centang persetujuan privasi terlebih dahulu.';
if(d.website)return done('SC-00000000');
if(!sb)return m.textContent='Layanan penyimpanan belum diaktifkan oleh pengelola situs, sehingga laporan belum dapat dikirim. Silakan hubungi pengacara lewat WhatsApp.';
const b=$('#go');b.disabled=true;b.textContent='Mengirim…';
const{data,error}=await sb.rpc('submit_report',{p_nama:d.nama.trim()||null,p_wa:d.wa.trim()||null,p_kategori:d.kategori,p_lokasi:d.lokasi.trim()||null,p_waktu:d.waktu.trim()||null,p_cerita:d.cerita.trim()});
if(error){b.disabled=false;b.textContent='Kirim Laporan';return m.textContent='Laporan gagal dikirim. Periksa koneksi lalu coba lagi.'}
done(data)}
const done=k=>app.innerHTML=`<div class="ok"><h1>Laporan Anda sudah terkirim</h1><p>Simpan kode laporan Anda:</p><p class="kode">${esc(k)}</p><p>Pengacara akan meninjau laporan Anda. Bila Anda mengisi nomor WhatsApp, Anda dapat dihubungi melalui nomor tersebut. Pengiriman laporan tidak otomatis membentuk hubungan pengacara-klien.</p></div>${EMG}<a class="btn" href="#/">Kembali ke Beranda</a>`;
const priv=()=>app.innerHTML=`<h1>Kebijakan Privasi</h1><ul><li>Data yang dikumpulkan hanya yang Anda isi di formulir: nama, nomor WhatsApp, lokasi, waktu, dan cerita. Semua kecuali cerita bersifat opsional.</li><li>Data dipakai hanya untuk meninjau dan menindaklanjuti laporan Anda.</li><li>Laporan hanya dapat dibaca oleh pengacara melalui akun admin; tidak ditampilkan kepada publik.</li><li>Cerita tidak dikirim lewat tautan atau parameter URL.</li><li>Untuk meminta penghapusan data, hubungi pengacara lewat WhatsApp dan sebutkan kode laporan Anda.</li><li>Notifikasi laporan baru kepada pengacara hanya memuat kode laporan, bukan isi cerita.</li><li>Pengiriman laporan adalah pengaduan awal dan tidak otomatis membentuk hubungan pengacara-klien.</li></ul>${EMG}`;
/* ADMIN */
const ST={baru:'Baru',ditinjau:'Sedang Ditinjau',penanganan:'Dalam Penanganan',selesai:'Selesai'};let ALL=[];
const wn=n=>{n=(n||'').replace(/\D/g,'');if(n[0]==='0')n='62'+n.slice(1);else if(n[0]==='8')n='62'+n;return n.length>=10?n:''};
function login(msg){app.innerHTML=`<h1>Masuk Pengacara</h1><form id="lf"><label>Email<input name="e" type="email" autocomplete="username" required></label><label>Kata sandi<input name="p" type="password" autocomplete="current-password" required></label><p class="err" id="lm">${esc(msg||'')}</p><button class="btn d">Masuk</button></form>`;
$('#lf').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:e.target.e.value,password:e.target.p.value});if(error)return $('#lm').textContent='Email atau kata sandi salah.';admin()}}
async function admin(){if(!sb)return app.innerHTML='<h1>Dashboard</h1><p class="err">Database belum dikonfigurasi. Isi config.js sesuai panduan README.</p>';
const{data:{session}}=await sb.auth.getSession();if(!session)return login();
const{data:ok}=await sb.rpc('is_admin');if(!ok){await sb.auth.signOut();return login('Akun ini tidak memiliki akses admin.')}
app.innerHTML=`<h1>Dashboard Pengacara</h1><div class="tools"><input id="q" placeholder="Cari nama, kode, lokasi, cerita…"><select id="fk"><option value="">Semua kategori</option>${K.map(k=>`<option>${k.t}</option>`).join('')}</select><select id="fs"><option value="">Semua status</option>${Object.entries(ST).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><button class="btn d" id="out">Keluar</button></div><p id="cnt"></p><div id="list">Memuat…</div>`;
$('#out').onclick=async()=>{await sb.auth.signOut();admin()};
const{data,error}=await sb.from('reports').select('*').order('created_at',{ascending:false});
if(error)return $('#list').textContent='Gagal memuat: '+error.message;ALL=data;['q','fk','fs'].forEach(i=>$('#'+i).oninput=draw);
$('#list').onchange=async e=>{const id=e.target.dataset.id;if(!id)return;const{error}=await sb.from('reports').update({status:e.target.value}).eq('id',id);if(error)return alert('Gagal mengubah status.');ALL.find(r=>r.id===id).status=e.target.value};
$('#list').onclick=async e=>{const id=e.target.dataset.del;if(!id)return;const r=ALL.find(x=>x.id===id);if(!confirm('Hapus laporan '+r.kode+' secara permanen?'))return;const{error}=await sb.from('reports').delete().eq('id',id);if(error)return alert('Gagal menghapus.');ALL=ALL.filter(x=>x.id!==id);draw()};draw()}
function draw(){const q=$('#q').value.toLowerCase(),k=$('#fk').value,s=$('#fs').value;
const L=ALL.filter(r=>(!k||r.kategori===k)&&(!s||r.status===s)&&(!q||[r.kode,r.nama,r.cerita,r.lokasi,r.wa].join(' ').toLowerCase().includes(q)));$('#cnt').textContent=L.length+' laporan';
$('#list').innerHTML=L.length?L.map(r=>{const n=wn(r.wa);return`<details class="card"><summary><b>${esc(r.kode)}</b> · ${esc(r.kategori)} · ${new Date(r.created_at).toLocaleString('id-ID')} <span class="tag">${ST[r.status]}</span></summary><p><b>Nama:</b> ${esc(r.nama||'-')}<br><b>WhatsApp:</b> ${esc(r.wa||'-')}<br><b>Lokasi:</b> ${esc(r.lokasi||'-')}<br><b>Waktu kejadian:</b> ${esc(r.waktu||'-')}</p><p style="white-space:pre-wrap">${esc(r.cerita)}</p><select data-id="${r.id}" aria-label="Status">${Object.entries(ST).map(([v,l])=>`<option value="${v}"${v===r.status?' selected':''}>${l}</option>`).join('')}</select>${n?`<a class="btn wa" target="_blank" rel="noopener" href="${waUrl(n,'Halo, kami dari siniCerita menindaklanjuti laporan '+r.kode+'.')}">Buka WhatsApp</a>`:''}<button class="btn d" data-del="${r.id}">Hapus</button></details>`}).join(''):'<p>Belum ada laporan yang cocok.</p>'}
const R={'':home,kategori:cats,info,lapor:form,privasi:priv,admin};
function route(){const[p,a]=location.hash.replace(/^#\/?/,'').split('/');(Object.hasOwn(R,p||'')?R[p||'']:home)(a);scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
